spring:
  application:
    name: "gatewayserver"
  config:
    import: "optional:configserver:http://localhost:8071"
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:7080/realms/master/protocol/openid-connect/certs"
  cloud:
    gateway:
      mvc:
        routes:
          - id: accounts-route
            uri: lb://accounts
            predicates:
              - Path=/celikbank/accounts/**
            filters:
              - StripPrefix=2

          - id: cards-route
            uri: lb://cards
            predicates:
              - Path=/celikbank/cards/**
            filters:
              - StripPrefix=2

          - id: loans-route
            uri: lb://loans
            predicates:
              - Path=/celikbank/loans/**
            filters:
              - StripPrefix=2
        http-client:
          connect-timeout: 1000ms
          response-timeout: 10s
    kubernetes:
      discovery:
        enabled: true
        all-namespaces: true
    discovery:
      client:
        health-indicator:
          enabled: false
  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 1s
management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
info:
  app:
    name: "gatewayserver"
    description: "Celikbank Gateway Service"
    version: "1.0.0"
logging:
  level:
    com:
      rafetcelik:
        gatewayserver: DEBUG
resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      waitDurationInOpenState: 10000
      failureRateThreshold: 50
