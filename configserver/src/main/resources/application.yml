server:
  port: 8071
spring:
  application:
    name: "configserver"
  profiles:
    active: "git"
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/rafettcelikk/rafetcelik-config.git"
          default-label: "main"
          timeout: 5
          clone-on-start: true
          force-pull: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

encrypt:
  key: "a8F$kP9!zQ3@Lm72#Xc4Vb1%Rt6^Np0&"
